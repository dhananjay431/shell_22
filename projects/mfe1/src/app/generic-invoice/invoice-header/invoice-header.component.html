<div class="page-title-row">
  <div class="page-title">Invoice {{ workitemno() }}</div>
  <span class="status-pill sp-success"
    ><i class="ti ti-circle-check" style="font-size: 11px"></i>AI Processing Complete</span
  >
  <div class="page-actions">
    <button class="btn" onclick="t('Invoice sent back to vendor', 'warning')">Send Back</button>
    <button class="btn" onclick="t('Information request sent to vendor', 'info')">
      Request Info
    </button>
    <div class="hold-btn" onclick="t('Invoice placed on hold', 'warning')">
      <i class="ti ti-pause" style="font-size: 13px"></i>Hold<i
        class="ti ti-chevron-down"
        style="font-size: 10px; opacity: 0.6"
      ></i>
    </div>
    <button class="btn-post" onclick="t('Invoice posted to SAP MIRO successfully!', 't-success')">
      <i class="ti ti-check" style="font-size: 13px"></i>Post Invoice<i
        class="ti ti-chevron-down"
        style="font-size: 10px; opacity: 0.7"
      ></i>
    </button>
  </div>
</div>
