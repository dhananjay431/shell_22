<div *ngIf="ob | async as dt">
<div style="font-size: 11.5px; color: var(--text2); margin-bottom: 10px">
  {{obj(dt).length }} system events recorded for this invoice
</div>
<div style="display: flex; flex-direction: column; gap: 0">
  <div style="
              display: flex;
              gap: 8px;
              padding: 7px 0;
              border-bottom: 1px solid var(--border);
            ">
    <div style="
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--success);
                flex-shrink: 0;
                margin-top: 4px;
              "></div>
    <div >
      @for(item of obj(dt); track item.id){
      <div>

        <div style="font-size: 11.5px; font-weight: 500">
          {{item.ACTION_COMMENT}}
        </div>
        <div style="font-size: 10px; color: var(--text3)">
          {{item.CREATED_ON}} / {{item.CREATED_BY}}
        </div>
      </div>
      }

    </div>

  </div>

</div>
</div>
