<div style="display: flex; flex-direction: column; gap: 7px" *ngIf="ob | async as dt">
  @for(item of obj(dt); track item.id){
       <div
            style="
              display: flex;
              align-items: center;
              gap: 9px;
              padding: 8px;
              background: var(--navy3);
              border-radius: var(--radius-sm);
              border: 1px solid var(--border);
            "
          >
            <i
              class="ti ti-file-type-pdf"
              style="color: var(--red); font-size: 20px"
            ></i>
            <div style="flex: 1">
              <div style="font-size: 11.5px; font-weight: 500">
                {{item.DOCUMENT_NAME}}
              </div>
              <div style="font-size: 10px; color: var(--text3)">
                Original Invoice · 342 KB
              </div>
            </div>
            <button
              class="btn"
              style="font-size: 10.5px; padding: 3px 9px"
              onclick="t('Downloading…', 't-info')"
            >
              Download
            </button>
          </div>
  }
   
          
        </div>
